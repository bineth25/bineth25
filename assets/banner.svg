<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey, I'm Bineth Hansada">
  <title>Hey, I'm Bineth Hansada</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset=".5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#5eead4" flood-opacity=".35"/>
    </filter>
  </defs>

  <style>
    .star   { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    .t2     { animation-duration: 4s;   animation-delay: .8s; }
    .t3     { animation-duration: 2.4s; animation-delay: 1.4s; }
    .t4     { animation-duration: 3.6s; animation-delay: 2.2s; }

    .wave1  { animation: drift 14s linear infinite; }
    .wave2  { animation: drift 22s linear infinite reverse; }

    .shoot  { animation: shoot 8s linear infinite; }

    .floatA { animation: float 3.2s ease-in-out infinite; }
    .floatB { animation: float 3.8s ease-in-out .6s infinite; }
    .eye    { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .waveA  { animation: waveA 1s ease-in-out infinite; transform-origin: 204px 166px; }
    .waveB  { animation: waveB 1s ease-in-out .3s infinite; transform-origin: -41px 48px; }
    .look   { animation: look 5s ease-in-out infinite; }
    .ant    { animation: pulse 1.4s ease-in-out infinite; }
    .belly  { animation: pulse 1.8s ease-in-out infinite; }

    .sym    { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 22px; font-weight: 700; opacity: .6; animation: bob 4s ease-in-out infinite; }
    .s2     { animation-delay: .9s; }
    .s3     { animation-delay: 1.8s; }
    .s4     { animation-delay: 2.6s; }

    .title  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 52px; }
    .uline  { transform-box: fill-box; transform-origin: center; animation: grow 1.4s ease-out both; }

    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes drift   { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes shoot   { 0% { transform: translate(0,0); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(420px,150px); opacity: 0; } 100% { transform: translate(420px,150px); opacity: 0; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes waveA   { 0%,100% { transform: rotate(-105deg); } 50% { transform: rotate(-150deg); } }
    @keyframes waveB   { 0%,100% { transform: rotate(105deg); }  50% { transform: rotate(150deg); } }
    @keyframes look    { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-5px); } 60% { transform: translateX(5px); } }
    @keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g>
    <circle class="star"      cx="40"   cy="30"  r="1.6"/>
    <circle class="star t2"   cx="95"   cy="120" r="1.2"/>
    <circle class="star t3"   cx="150"  cy="40"  r="1.4"/>
    <circle class="star t4"   cx="210"  cy="95"  r="1"/>
    <circle class="star t2"   cx="260"  cy="25"  r="1.6"/>
    <circle class="star"      cx="300"  cy="140" r="1"/>
    <circle class="star t3"   cx="340"  cy="50"  r="1.2"/>
    <circle class="star t4"   cx="390"  cy="110" r="1.4"/>
    <circle class="star"      cx="430"  cy="30"  r="1"/>
    <circle class="star t2"   cx="480"  cy="85"  r="1.6"/>
    <circle class="star t3"   cx="530"  cy="35"  r="1.2"/>
    <circle class="star t4"   cx="580"  cy="115" r="1"/>
    <circle class="star"      cx="640"  cy="28"  r="1.6"/>
    <circle class="star t2"   cx="690"  cy="70"  r="1.2"/>
    <circle class="star t3"   cx="740"  cy="40"  r="1"/>
    <circle class="star t4"   cx="790"  cy="105" r="1.4"/>
    <circle class="star"      cx="840"  cy="30"  r="1.6"/>
    <circle class="star t2"   cx="890"  cy="80"  r="1.2"/>
    <circle class="star t3"   cx="930"  cy="130" r="1"/>
    <circle class="star t4"   cx="970"  cy="45"  r="1.4"/>
    <circle class="star"      cx="1020" cy="25"  r="1.2"/>
    <circle class="star t2"   cx="1080" cy="60"  r="1.6"/>
    <circle class="star t3"   cx="1140" cy="35"  r="1"/>
    <circle class="star t4"   cx="1170" cy="110" r="1.4"/>
    <circle class="star t3"   cx="60"   cy="215" r="1.2"/>
    <circle class="star"      cx="120"  cy="270" r="1"/>
    <circle class="star t2"   cx="250"  cy="230" r="1.4"/>
    <circle class="star t4"   cx="420"  cy="260" r="1"/>
    <circle class="star t3"   cx="560"  cy="245" r="1.2"/>
    <circle class="star"      cx="700"  cy="265" r="1"/>
    <circle class="star t2"   cx="850"  cy="240" r="1.4"/>
    <circle class="star t4"   cx="980"  cy="270" r="1"/>
    <circle class="star"      cx="1150" cy="200" r="1.2"/>
  </g>

  <!-- shooting star -->
  <g class="shoot">
    <line x1="330" y1="20" x2="372" y2="36" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- soft waves -->
  <g fill="#ffffff">
    <path class="wave2" opacity=".05" d="M0,292 q150,-34 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V320 H0 Z"/>
    <path class="wave1" opacity=".08" d="M0,300 q150,-30 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V320 H0 Z"/>
  </g>

  <!-- floating code symbols -->
  <g text-anchor="middle">
    <text class="sym"    x="250" y="78"  fill="#5eead4">&lt;/&gt;</text>
    <text class="sym s2" x="950" y="74"  fill="#f472b6">{ }</text>
    <text class="sym s3" x="265" y="262" fill="#a78bfa">py</text>
    <text class="sym s4" x="935" y="266" fill="#5eead4">AI</text>
    <text class="sym s2" x="600" y="288" fill="#f472b6">ML</text>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text class="title" x="300" y="178" textLength="600" lengthAdjust="spacingAndGlyphs" fill="url(#tg)">Hey, I'm Bineth Hansada</text>
  </g>
  <rect class="uline" x="300" y="202" width="600" height="4" rx="2" fill="url(#tg)"/>

  <!-- character 1: waving robot (left) -->
  <g transform="translate(-6,50) scale(.8)">
    <g class="floatA">
      <line x1="150" y1="40" x2="150" y2="64" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
      <circle class="ant" cx="150" cy="34" r="8" fill="#5eead4"/>

      <rect x="86"  y="92" width="10"  height="28" rx="5"  fill="#a78bfa"/>
      <rect x="204" y="92" width="10"  height="28" rx="5"  fill="#a78bfa"/>
      <rect x="95"  y="62" width="110" height="84" rx="26" fill="#38bdf8"/>
      <rect x="107" y="76" width="86"  height="56" rx="18" fill="#0b1d26"/>

      <ellipse class="eye" cx="131" cy="102" rx="9" ry="11" fill="#5eead4"/>
      <ellipse class="eye" cx="169" cy="102" rx="9" ry="11" fill="#5eead4"/>
      <path d="M138 121 Q150 130 162 121" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round"/>

      <rect x="118" y="222" width="26" height="14" rx="7" fill="#38bdf8"/>
      <rect x="156" y="222" width="26" height="14" rx="7" fill="#38bdf8"/>

      <rect x="110" y="152" width="80" height="76" rx="22" fill="#7f5af0"/>
      <rect x="127" y="170" width="46" height="30" rx="8"  fill="#0b1d26"/>
      <text x="150" y="191" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="16" font-weight="700" fill="#5eead4">&lt;/&gt;</text>

      <rect x="88" y="160" width="20" height="48" rx="10" fill="#38bdf8"/>
      <circle cx="98" cy="210" r="9" fill="#5eead4"/>

      <g class="waveA">
        <rect x="194" y="156" width="20" height="48" rx="10" fill="#38bdf8"/>
        <circle cx="204" cy="206" r="9" fill="#5eead4"/>
      </g>
    </g>
  </g>

  <!-- character 2: round visor bot (right) -->
  <g transform="translate(1075,158)">
    <g class="floatB">
      <line x1="-14" y1="-50" x2="-24" y2="-72" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
      <line x1="14"  y1="-50" x2="24"  y2="-72" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
      <circle class="ant" cx="-24" cy="-76" r="6" fill="#f472b6"/>
      <circle class="ant" cx="24"  cy="-76" r="6" fill="#f472b6" style="animation-delay:.7s"/>

      <rect x="-54" y="-24" width="10" height="28" rx="5" fill="#f472b6"/>
      <rect x="44"  y="-24" width="10" height="28" rx="5" fill="#f472b6"/>
      <circle cx="0" cy="-10" r="46" fill="#14b8a6"/>
      <rect x="-34" y="-28" width="68" height="36" rx="18" fill="#0b1d26"/>
      <g class="look">
        <circle cx="-14" cy="-10" r="7" fill="#f472b6"/>
        <circle cx="14"  cy="-10" r="7" fill="#f472b6"/>
      </g>

      <rect x="-26" y="90" width="22" height="13" rx="6.5" fill="#14b8a6"/>
      <rect x="4"   y="90" width="22" height="13" rx="6.5" fill="#14b8a6"/>

      <rect x="-30" y="38" width="60" height="58" rx="18" fill="#7f5af0"/>
      <circle class="belly" cx="0" cy="66" r="9" fill="#5eead4"/>

      <g class="waveB">
        <rect x="-48" y="44" width="14" height="38" rx="7" fill="#14b8a6"/>
        <circle cx="-41" cy="84" r="7" fill="#f472b6"/>
      </g>
      <rect x="34" y="44" width="14" height="38" rx="7" fill="#14b8a6"/>
      <circle cx="41" cy="84" r="7" fill="#f472b6"/>
    </g>
  </g>
</svg>
