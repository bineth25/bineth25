<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" role="img" aria-label="Friendly animated robot waving">
  <style>
    .float  { animation: float 3s ease-in-out infinite; }
    .shadow { animation: shadow 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eye    { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    .wave   { animation: wave 1s ease-in-out infinite; transform-origin: 204px 166px; }
    .ant    { animation: pulse 1.4s ease-in-out infinite; }
    .chip1  { animation: rise 4s ease-in-out infinite; }
    .chip2  { animation: rise 4s ease-in-out 1.3s infinite; }
    .chip3  { animation: rise 4s ease-in-out 2.6s infinite; }

    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1);  opacity: .22; } 50% { transform: scaleX(.8); opacity: .12; } }
    @keyframes blink  { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes wave   { 0%,100% { transform: rotate(-105deg); } 50% { transform: rotate(-150deg); } }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes rise   { 0% { transform: translateY(20px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="150" cy="264" rx="58" ry="8" fill="#000"/>

  <!-- floating code chips -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">
    <text class="chip1" x="48"  y="130" fill="#0e75b6">py</text>
    <text class="chip2" x="252" y="110" fill="#7f5af0">{ }</text>
    <text class="chip3" x="40"  y="200" fill="#14b8a6">ML</text>
  </g>

  <g class="float">
    <!-- antenna -->
    <line x1="150" y1="40" x2="150" y2="64" stroke="#7f5af0" stroke-width="5" stroke-linecap="round"/>
    <circle class="ant" cx="150" cy="34" r="8" fill="#14b8a6"/>

    <!-- head -->
    <rect x="86"  y="92"  width="10"  height="28" rx="5"  fill="#7f5af0"/>
    <rect x="204" y="92"  width="10"  height="28" rx="5"  fill="#7f5af0"/>
    <rect x="95"  y="62"  width="110" height="84" rx="26" fill="#0e75b6"/>
    <rect x="107" y="76"  width="86"  height="56" rx="18" fill="#1b1f23"/>

    <!-- face -->
    <ellipse class="eye" cx="131" cy="102" rx="9" ry="11" fill="#5eead4"/>
    <ellipse class="eye" cx="169" cy="102" rx="9" ry="11" fill="#5eead4"/>
    <path d="M138 121 Q150 130 162 121" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- feet -->
    <rect x="118" y="222" width="26" height="14" rx="7" fill="#0e75b6"/>
    <rect x="156" y="222" width="26" height="14" rx="7" fill="#0e75b6"/>

    <!-- body -->
    <rect x="110" y="152" width="80" height="76" rx="22" fill="#7f5af0"/>
    <rect x="127" y="170" width="46" height="30" rx="8"  fill="#1b1f23"/>
    <text x="150" y="191" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="16" font-weight="700" fill="#5eead4">&lt;/&gt;</text>

    <!-- left arm -->
    <rect x="88" y="160" width="20" height="48" rx="10" fill="#0e75b6"/>
    <circle cx="98" cy="210" r="9" fill="#5eead4"/>

    <!-- right arm (waving) -->
    <g class="wave">
      <rect x="194" y="156" width="20" height="48" rx="10" fill="#0e75b6"/>
      <circle cx="204" cy="206" r="9" fill="#5eead4"/>
    </g>
  </g>
</svg>
